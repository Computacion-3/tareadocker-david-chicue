<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sesión cerrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{styles.css}" rel="stylesheet">
</head>

<body class="login-container">

<div class="login-wrapper">
    <div class="login-bg"></div>
    <div class="login-form-section">

        <img th:src="@{/images/logo.png}" class="logo-corner">

        <div class="login-card text-center">

            <div class="mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="#198754"
                     class="bi bi-check-circle" viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                    <path d="m10.97 4.97-.02.022-3.473 4.425-2.093-2.094a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-1.071-1.05"/>
                </svg>
            </div>

            <h3 class="mb-2">Sesión cerrada</h3>
            <p class="text-muted small mb-4">Tu sesión ha sido cerrada correctamente.</p>

            <a th:href="@{/login}" class="btn btn-primary w-100">
                Volver al inicio de sesión
            </a>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
