<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/layout :: layout (~{::title}, ~{::section})">
<head>
  <title>Policies</title>
</head>

<body>
<section>
  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Lista de Pólizas</h3>
      <a th:href="@{/policies/create}" class="btn btn-success">
        <i class="fas fa-plus"></i> Añadir Póliza
      </a>
    </div>

    <table class="table table-striped table-hover shadow-sm">
      <thead class="table-dark">
      <tr>
        <th>Nombre</th>
        <th class="text-center">Acciones</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="p : ${policies}">
        <td th:text="${p.name}"></td>
        <td class="text-center">
          <a th:href="@{/policies/edit/{id}(id=${p.id})}"
             class="btn btn-warning btn-sm"
             title="Editar Póliza">
            <i class="fas fa-edit"></i> Editar
          </a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</section>
</body>
</html>
