$kind: http-request
url: "{{baseUrl}}/api/v1/activities/{{activityId}}"
method: PUT
headers:
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "name": "Yoga Class Updated",
      "description": "Evening yoga session",
      "duration": 90,
      "spaceId": {{spaceActivityId}},
      "scheduleId": {{scheduleId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response is not null", function () {
          pm.expect(pm.response.json()).to.not.be.null;
      });
      pm.test("Response has idActivity", function () {
          var d = pm.response.json();
          pm.expect(d.idActivity).to.not.be.null;
          pm.expect(d.idActivity).to.not.be.undefined;
      });
    language: text/javascript
order: 5000
