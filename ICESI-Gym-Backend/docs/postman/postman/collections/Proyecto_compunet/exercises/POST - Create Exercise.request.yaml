$kind: http-request
url: "{{baseUrl}}/api/v1/exercises"
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: json
  content: |
    {
      "name": "Push Up",
      "description": "Upper body exercise",
      "type": "strenght",
      "difficulty": "BEGINNER",
      "durationMin": 5,
      "isPredefined": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Response is not null", function () {
          pm.expect(pm.response.json()).to.not.be.null;
      });
      pm.test("Response has idExercise", function () {
          var d = pm.response.json();
          pm.expect(d.idExercise).to.not.be.null;
          pm.expect(d.idExercise).to.not.be.undefined;
      });
      var d = pm.response.json();
      if (d.idExercise) { pm.environment.set("exerciseId", d.idExercise); }
    language: text/javascript
order: 4000
