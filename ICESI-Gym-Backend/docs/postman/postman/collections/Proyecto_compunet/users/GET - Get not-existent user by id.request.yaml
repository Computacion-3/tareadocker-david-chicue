$kind: http-request
url: "{{baseUrl}}/api/v1/users/999999"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 404 for non-existent user\", function () {\r

      \    pm.response.to.have.status(404);\r

      });\r

      pm.test(\"Error message mentions not found\", function () {\r

      \    pm.expect(pm.response.json().message).to.include(\"not found\");\r

      });"
    language: text/javascript
order: 3000
