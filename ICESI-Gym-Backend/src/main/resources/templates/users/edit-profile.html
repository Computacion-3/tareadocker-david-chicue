<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout (~{::title}, ~{::section})}">
<head>
    <title>Editar Perfil</title>
</head>
<body>

<section class="container mt-5">

    <div class="row">

        <div class="col-md-6 mx-auto">

            <div class="card shadow-sm p-4">

                <h3 class="mb-3 text-center">Editar Perfil</h3>

                <form th:action="@{/users/edit-profile}"
                      method="post"
                      th:object="${user}">

                    <input type="hidden" th:field="*{idUser}">

                    <!-- Nombre -->
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text"
                               th:field="*{firstName}"
                               class="form-control"
                               required>
                    </div>

                    <!-- Apellido -->
                    <div class="mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text"
                               th:field="*{lastName}"
                               class="form-control"
                               required>
                    </div>

                    <!-- Email (solo lectura)/ no se si se pueda dejar cambiar -->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email"
                               th:field="*{institutionalEmail}"
                               class="form-control"
                               readonly>
                    </div>

                    <!-- Edad -->
                    <div class="mb-3">
                        <label class="form-label">Edad</label>
                        <input type="number"
                               th:field="*{age}"
                               class="form-control"
                               min="0">
                    </div>

                    <!-- Botones -->
                    <div class="d-flex justify-content-between">

                        <a th:href="@{/users/profile}"
                           class="btn btn-secondary">
                            Cancelar
                        </a>

                        <button type="submit"
                                class="btn btn-primary">
                            Guardar cambios
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</section>

</body>
</html>
