$kind: http-request
url: "{{baseUrl}}/api/v1/progress/{{progressId}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response is not null", function () {
          pm.expect(pm.response.json()).to.not.be.null;
      });
      pm.test("Response has idProgress", function () {
          var d = pm.response.json();
          pm.expect(d.idProgress).to.not.be.null;
          pm.expect(d.idProgress).to.not.be.undefined;
      });
    language: text/javascript
order: 3000
