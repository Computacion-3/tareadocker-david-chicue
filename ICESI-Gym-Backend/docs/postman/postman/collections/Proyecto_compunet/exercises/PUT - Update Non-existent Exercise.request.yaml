$kind: http-request
url: "{{baseUrl}}/api/v1/exercises/999999"
method: PUT
headers:
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "name": "Push Up Advanced",
      "description": "Advanced upper body exercise",
      "type": "strenght",
      "difficulty": "BEGINNER",
      "durationMin": 5,
      "isPredefined": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 404 for non-existent resource", function () {
          pm.response.to.have.status(404);
      });
      pm.test("Error message mentions not found", function () {
          pm.expect(pm.response.json().message).to.include("not found");
      });
    language: text/javascript
order: 6000
