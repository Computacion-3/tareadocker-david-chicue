$kind: http-request
url: "{{baseUrl}}/api/v1/policies"
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: json
  content: "{\r

    \  \"name\": \"TEST_POLICY\",\r

    \  \"description\": \"Policy for testing\",\r

    \  \"resource\": \"TESTS\",\r

    \  \"action\": \"READ\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 400 for duplicate policy name\", function () {\r

      \    pm.expect(pm.response.code).to.be.oneOf([400, 409, 500]);\r

      });"
    language: text/javascript
order: 3000
