$kind: http-request
url: "{{baseUrl}}/api/v1/progress/999999"
method: PUT
headers:
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "userId": {{userId}},
      "routineId": {{routineId}},
      "completionDate": "2026-05-10",
      "notes": "Updated notes"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 404 for non-existent resource", function () {
          pm.response.to.have.status(404);
      });
      pm.test("Error message mentions not found", function () {
          pm.expect(pm.response.json().message).to.include("not found");
      });
    language: text/javascript
order: 6000
