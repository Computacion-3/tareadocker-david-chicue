<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <title>Registro</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/styles.css}" rel="stylesheet">
</head>

<body class="login-container">

<div class="login-wrapper">

  <div class="register-bg position-relative">

    <img th:src="@{/images/logo.png}" class="logo-overlay">

  </div>

  <div class="login-form-section">

    <div class="login-card">

      <h3 class="text-center mb-4">Crear cuenta</h3>

      <form th:action="@{/register}" method="post" th:object="${newUser}">

        <div class="mb-2">
          <label class="form-label">Nombre</label>
          <input type="text" th:field="*{firstName}" class="form-control" required>
        </div>

        <div class="mb-2">
          <label class="form-label">Apellido</label>
          <input type="text" th:field="*{lastName}" class="form-control" required>
        </div>

        <div class="mb-2">
          <label class="form-label">Email Institucional</label>
          <input type="text" th:field="*{institutionalEmail}" class="form-control" required>
        </div>

        <div class="mb-2">
          <label class="form-label">Contraseña</label>
          <input type="password" th:field="*{password}" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Edad</label>
          <input type="number" min="0" max="99" th:field="*{age}" class="form-control age-input" required>
        </div>

        <button class="btn btn-primary w-100">Registrar</button>

        <p class="text-center mt-3">
          <a th:href="@{/login}">Volver al login</a>
        </p>

      </form>

    </div>

  </div>

</div>

<div class="toast-container position-fixed top-0 end-0 p-3">

  <div th:if="${param.success}" class="toast text-bg-success">
    <div class="toast-body">
      Usuario registrado correctamente
    </div>
  </div>

  <div th:if="${param.error}" class="toast text-bg-danger">
    <div class="toast-body">
      Error al registrar
    </div>
  </div>

  <div th:if="${param.domain}" class="toast text-bg-danger">
    <div class="toast-body">
      Solo correos institucionales permitidos
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/script.js}"></script>
</body>
</html>
