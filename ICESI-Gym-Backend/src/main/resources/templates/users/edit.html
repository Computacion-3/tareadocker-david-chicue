<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout (~{::title}, ~{::section})}">
<head>
    <title>Editar Usuario</title>
</head>
<body>

<section class="container mt-5">

    <div class="card p-4 col-md-6 mx-auto">

        <h3>Editar Usuario</h3>

        <form th:action="@{/users/edit}" method="post" th:object="${user}">

            <input type="hidden" th:field="*{idUser}">

            <label>Nombre</label>
            <input type="text" th:field="*{firstName}" class="form-control mb-2">

            <label>Apellido</label>
            <input type="text" th:field="*{lastName}" class="form-control mb-2">

            <label>Email</label>
            <input type="text" th:field="*{institutionalEmail}" class="form-control mb-2">

            <label>Edad</label>
            <input type="number" th:field="*{age}" class="form-control mb-3">

            <button class="btn btn-primary">Actualizar</button>

        </form>

    </div>

</section>

</body>
</html>
