$kind: http-request
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
body:
  type: json
  content: "{\r

    \  \"firstName\": \"Test\",\r

    \  \"lastName\": \"User\",\r

    \  \"institutionalEmail\": \"{{testEmail}}\",\r

    \  \"password\": \"password123\",\r

    \  \"age\": 25\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 400 for duplicate email\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Response body is not null\", function () {\r

      \    pm.expect(pm.response.json()).to.not.be.null;\r

      });"
    language: text/javascript
order: 7000
