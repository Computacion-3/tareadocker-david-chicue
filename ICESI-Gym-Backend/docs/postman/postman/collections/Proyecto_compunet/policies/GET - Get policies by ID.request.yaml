$kind: http-request
url: "{{baseUrl}}/api/v1/policies/{{testPolicyId}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      pm.test(\"Policy name is TEST_POLICY\", function () {\r

      \    pm.expect(pm.response.json().name).to.eql(\"TEST_POLICY\");\r

      });"
    language: text/javascript
order: 6000
