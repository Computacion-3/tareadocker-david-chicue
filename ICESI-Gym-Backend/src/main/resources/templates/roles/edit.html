<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout (~{::title}, ~{::section})}">
<head>
    <title>Editar Rol</title>
</head>
<body>
<section class="container mt-5">

    <div class="card p-4 col-md-6 mx-auto">

        <h3>Editar Rol</h3>

        <form th:action="@{/roles/edit/{id}(id=${role.id})}" method="post">

            <input type="hidden" name="roleId" th:value="${role.id}">

            <!-- Nombre -->
            <label>Nombre del rol</label>
            <input type="text" name="name"
                   th:value="${role.name}"
                   class="form-control mb-3">

            <!-- Permisos -->
            <label>Permisos</label>

            <div class="form-check" th:each="pol : ${policies}">

                <input class="form-check-input"
                       type="checkbox"
                       name="policies"
                       th:value="${pol.id}"
                       th:checked="${currentPolicyIds.contains(pol.id)}">

                <label class="form-check-label"
                       th:text="${pol.name}">
                </label>

            </div>

            <button class="btn btn-primary mt-3">Actualizar</button>

        </form>

    </div>

</section>
</body>
</html>
