<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cerrando sesión...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{styles.css}" rel="stylesheet">
</head>

<body class="login-container">

<div class="login-wrapper">
    <div class="login-bg"></div>
    <div class="login-form-section">

        <img th:src="@{/images/logo.png}" class="logo-corner">

        <div class="login-card text-center">

            <h3 class="mb-2">Cerrando sesión</h3>
            <p class="text-muted small mb-4">Serás redirigido automáticamente</p>

            <div class="countdown-circle mb-4">
                <svg class="ring" viewBox="0 0 98 98">
                    <circle cx="49" cy="49" r="45" id="progress-ring"/>
                </svg>
                <span id="countdown">3</span>
            </div>

            <form id="logout-form" th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    Cerrar sesión ahora
                </button>

                <a th:href="@{/home}" class="btn btn-outline-secondary w-100">
                    Cancelar
                </a>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{script.js}"></script>
<script th:src="@{logout.js}"></script>

</body>
</html>
