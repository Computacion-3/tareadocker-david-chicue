$kind: http-request
url: "{{baseUrl}}/api/v1/recommendations/{{recommedationId}}"
method: PUT
headers:
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "description": "Updated recommendation",
      "userId": {{userId}},
      "trainerId": {{userId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response is not null", function () {
          pm.expect(pm.response.json()).to.not.be.null;
      });
      pm.test("Response has idRecommendation", function () {
          var d = pm.response.json();
          pm.expect(d.idRecommendation).to.not.be.null;
          pm.expect(d.idRecommendation).to.not.be.undefined;
      });
    language: text/javascript
order: 5000
