$kind: http-request
url: "{{baseUrl}}/api/v1/schedules/{{scheduleId}}"
method: PUT
headers:
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "activityId": {{activityId}},
      "dayOfWeek": "TUESDAY",
      "startTime": "10:00:00",
      "endTime": "11:00:00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response is not null", function () {
          pm.expect(pm.response.json()).to.not.be.null;
      });
      pm.test("Response has idSchedule", function () {
          var d = pm.response.json();
          pm.expect(d.idSchedule).to.not.be.null;
          pm.expect(d.idSchedule).to.not.be.undefined;
      });
    language: text/javascript
order: 5000
