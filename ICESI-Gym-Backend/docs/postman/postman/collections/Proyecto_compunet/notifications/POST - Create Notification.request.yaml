$kind: http-request
url: "{{baseUrl}}/api/v1/notifications"
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: json
  content: |
    {
      "type": "MESSAGE",
      "message": "This is a test notification",
      "referenceId": 1,
      "referenceType": "MESSAGE",
      "userSourceId": 1,
      "userTargetId": {{testUserId}},
      "isRead": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Response is not null", function () {
          pm.expect(pm.response.json()).to.not.be.null;
      });
      pm.test("Response has idNotification", function () {
          var d = pm.response.json();
          pm.expect(d.idNotification).to.not.be.null;
          pm.expect(d.idNotification).to.not.be.undefined;
      });
      var d = pm.response.json();
      if (d.idNotification) { pm.environment.set("notificationId", d.idNotification); }
    language: text/javascript
order: 1000
