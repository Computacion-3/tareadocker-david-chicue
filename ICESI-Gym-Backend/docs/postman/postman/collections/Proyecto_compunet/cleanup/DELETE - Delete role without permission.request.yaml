$kind: http-request
url: "{{baseUrl}}/api/v1/roles/{{testRoleId}}"
method: DELETE
headers:
  Authorization: Bearer {{basicToken}}
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 403\", function () {\r

      \    pm.response.to.have.status(403);\r

      });\r

      \r

      pm.test(\"Access Denied\", function () {\r

      \    pm.expect(pm.response.text()).to.include(\"Access Denied\");\r

      });\r\n"
    language: text/javascript
order: 4000
