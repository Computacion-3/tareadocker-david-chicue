$kind: http-request
url: "{{baseUrl}}/api/v1/routines"
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "name": "Morning Routine",
      "description": "Full body morning workout",
      "difficulty": "INTERMEDIATE",
      "userId": {{userId}},
      "isPredesigned": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Response is not null", function () {
          pm.expect(pm.response.json()).to.not.be.null;
      });
      pm.test("Response has idRoutine", function () {
          var d = pm.response.json();
          pm.expect(d.idRoutine).to.not.be.null;
          pm.expect(d.idRoutine).to.not.be.undefined;
      });
      var d = pm.response.json();
      if (d.idRoutine) { pm.environment.set("routineId", d.idRoutine); }
    language: text/javascript
order: 1000
