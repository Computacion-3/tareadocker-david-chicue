$kind: http-request
url: "{{baseUrl}}/api/v1/messages"
method: GET
headers:
  Authorization: Bearer {{basicToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 403 - Forbidden", function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 5000
